use_default_settings: true

general:
  debug: false
  instance_name: "GronnFalk Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false
  open_metrics: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 4
  favicon_resolver: "google"
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "gR7xQ2mP9vL4nK8sW3zF6aT1yU5cB0dE"
  limiter: false
  public_instance: false
  image_proxy: true

outgoing:
  request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  useragent_suffix: ""

redis:
  url: redis://redis:6379/0
